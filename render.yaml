# Render Blueprint — static site, no build step.
# The whole site is plain HTML, CSS and JS, so the repository root IS the
# publish directory. Nothing is compiled, bundled or installed.
services:
  - type: web
    name: juman-portfolio
    runtime: static
    staticPublishPath: .
    autoDeploy: true
    headers:
      # Fingerprint-free assets, so cache them hard but let HTML revalidate.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
